[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gaetschwartz/sqlx-testdb"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
camino = "1.2.6"
futures-util = "0.3.34"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
snafu = { version = "0.9.2", features = ["backtrace"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "migrate"] }
syn = { version = "2.0.119", features = ["full"] }
tokio = { version = "1.53.1", features = ["rt"] }
toml = "1.1.6"
